services:
  agent-demo:
    build:
      context: .
      dockerfile: Dockerfile.agent-demo
    ports:
      - "127.0.0.1:8090:8000"
    environment:
      ATLAS_RAG_URL: ${ATLAS_RAG_URL:-}
      ATLAS_RAG_API_KEY: ${ATLAS_RAG_API_KEY:-}
      ATLAS_TENANT_ID: ${ATLAS_TENANT_ID:-}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
